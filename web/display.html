<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Viewer</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }
        #loadingSpinner {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            z-index: 999;
        }
    </style>
    
    <!-- Required Scripts in correct order -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    <div id="loadingSpinner" class="text-center">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <div class="mt-2">Loading CSV file...</div>
    </div>

    <div class="container mt-5">
        <h2 class="mb-4">CSV Data Viewer</h2>
        <div class="mb-3">
            <input type="file" id="csvFileInput" accept=".csv" class="form-control" />
        </div>    
        <div id="tableContainer" class="table-responsive">
            <table id="dataTable" 
                   class="table table-striped table-bordered" 
                   style="width:100%">
            </table>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            let dataTable = null;

            function showSpinner() {
                $('#overlay').show();
                $('#loadingSpinner').show();
            }

            function hideSpinner() {
                $('#overlay').hide();
                $('#loadingSpinner').hide();
            }

            function initializeDataTable(data) {
                // Destroy existing table if it exists
                if (dataTable) {
                    dataTable.destroy();
                    $('#dataTable').empty();
                }

                // Create column definitions
                const columns = Object.keys(data[0] || {}).map(key => ({
                    title: key,
                    data: key,
                    defaultContent: ''
                }));

                // Initialize new table
                dataTable = $('#dataTable').DataTable({
                    data: data,
                    columns: columns,
                    processing: true,
                    pageLength: 25,
                    order: [],
                    scrollY: '60vh',
                    scrollX: true,
                    columnDefs: [{
                        orderable: false,
                        targets: '_all',
                    }]
                });

                console.log('DataTable initialized with columns:', columns);
            }

            $('#csvFileInput').on('change', function(event) {
                const file = event.target.files[0];
                if (!file) return;

                showSpinner();

                Papa.parse(file, {
                    header: true,
                    dynamicTyping: true,
                    complete: function(results) {
                        if (results.data && results.data.length > 0) {
                            try {
                                initializeDataTable(results.data);
                            } catch (error) {
                                console.error('Error initializing DataTable:', error);
                                alert('Error loading data. Please check console for details.');
                            }
                        } else {
                            console.error('No data found in CSV file');
                            alert('No data found in CSV file');
                        }
                        hideSpinner();
                    },
                    error: function(error) {
                        console.error('Error parsing CSV:', error);
                        alert('Error parsing CSV file');
                        hideSpinner();
                    }
                });
            });
        });
    </script>
</body>
</html>
