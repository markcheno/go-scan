<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configuration Editor</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx.org/1.9.6/htmx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Configuration Editor</h1>
        
        <div id="editor-container">
            <form id="yaml-form" hx-post="/save" hx-target="#status" hx-swap="innerHTML">
                <div class="mb-3">
                    <label for="outfile" class="form-label">Output File</label>
                    <input type="text" class="form-control" id="outfile" name="outfile" value="nasdaq100.csv">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="start_date" class="form-label">Start Date</label>
                        <input type="date" class="form-control" id="start_date" name="start_date" value="2010-01-01">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="end_date" class="form-label">End Date</label>
                        <input type="date" class="form-control" id="end_date" name="end_date" value="2025-01-21">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="source" class="form-label">Source</label>
                    <input type="text" class="form-control" id="source" name="source" value="yahoo">
                </div>

                <div class="mb-3">
                    <label for="tickers" class="form-label">Tickers</label>
                    <textarea class="form-control" id="tickers" name="tickers" rows="3">spy
qqq</textarea>
                </div>

                <div class="mb-3">
                    <label for="market" class="form-label">Market</label>
                    <input type="text" class="form-control" id="market" name="market" value="nasdaq100">
                </div>

                <div class="mb-3">
                    <label for="columns" class="form-label">Columns</label>
                    <textarea class="form-control" id="columns" name="columns" rows="3">roc1=roc(c,1)
roc5=roc(c,5)
roc10=roc(c,10)
roc20=roc(c,20)
roc50=roc(c,50)
sma_v50=sma(v,50)</textarea>
                </div>

                <div class="mb-3">
                    <label for="drop_columns" class="form-label">Drop Columns</label>
                    <input type="text" class="form-control" id="drop_columns" name="drop_columns" value="open,high,low,volume">
                </div>

                <div class="mb-3">
                    <label for="filter" class="form-label">Filter</label>
                    <input type="text" class="form-control" id="filter" name="filter" value="(close > 100) && (sma_v50 > 1000000)">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="truncate" class="form-label">Truncate</label>
                        <input type="number" class="form-control" id="truncate" name="truncate" value="50">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="split_pct" class="form-label">Split Percentage</label>
                        <input type="number" step="0.1" class="form-control" id="split_pct" name="split_pct" value="0.8">
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset</button>
                    <button type="submit" class="btn btn-primary">Save Configuration</button>
                </div>
            </form>

            <div id="status" class="mt-3"></div>

            <div class="mt-4">
                <h3>Raw YAML Preview</h3>
                <pre id="yaml-preview" class="bg-light p-3"></pre>
            </div>
        </div>
    </div>

    <script>
        function updateYAMLPreview() {
            const formData = new FormData(document.getElementById('yaml-form'));
            const yamlData = {
                outfile: formData.get('outfile'),
                start_date: formData.get('start_date'),
                end_date: formData.get('end_date'),
                source: formData.get('source'),
                tickers: formData.get('tickers').split('\n').map(t => t.trim().replace('- ', '')),
                market: formData.get('market'),
                columns: formData.get('columns').split('\n').map(t => t.trim().replace('- ', '')),
                drop_columns: formData.get('drop_columns').split(',').map(t => t.trim()),
                filter: formData.get('filter'),
                truncate: parseInt(formData.get('truncate')),
                split_pct: parseFloat(formData.get('split_pct'))
            };

            document.getElementById('yaml-preview').textContent = 
                jsyaml.dump(yamlData);
        }

        function resetForm() {
            document.getElementById('yaml-form').reset();
            updateYAMLPreview();
        }

        // Update YAML preview on input changes
        document.getElementById('yaml-form').addEventListener('input', updateYAMLPreview);
        updateYAMLPreview(); // Initial preview
    </script>
</body>
</html>
